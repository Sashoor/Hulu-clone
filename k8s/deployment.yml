apiVersion: apps/v1
kind: Deployment
metadata:
  name: hulu-clone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hulu-clone
  template:
    metadata:
      labels:
        app: hulu-clone
    spec:
      containers:
        - name: hulu-clone
          image: hulu-clone:local
          ports:
            - containerPort: 80
