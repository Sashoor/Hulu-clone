apiVersion: apps/v1
kind: Deployment
metadata:
  name: hulu-clone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hulu-clone
  template:
    metadata:
      labels:
        app: hulu-clone
    spec:
      containers:
        - name: hulu-clone
          image: ghcr.io/sashoor/hulu-clone:847f61f51978f07948491b0d1986b16f8fc804a9
          ports:
            - containerPort: 80